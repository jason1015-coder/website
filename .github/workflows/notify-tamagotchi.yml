# Feeds the star tamagotchi on the profile repo the moment this repo is starred.
# Requires one secret here: TAMAGOTCHI_TOKEN, a token with Contents write on
# jason1015-coder/jason1015-coder. Without it the job exits quietly.

name: Notify the tamagotchi

on:
  watch:
    types: [started]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Tell the profile repo a star arrived
        env:
          TAMAGOTCHI_TOKEN: ${{ secrets.TAMAGOTCHI_TOKEN }}
        run: |
          if [ -z "$TAMAGOTCHI_TOKEN" ]; then
            echo "TAMAGOTCHI_TOKEN is not set for $GITHUB_REPOSITORY; skipping."
            exit 0
          fi

          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAMAGOTCHI_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jason1015-coder/jason1015-coder/dispatches" \
            -d "{\"event_type\":\"repo-starred\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\"}}")

          echo "dispatch response: $code"
          cat /tmp/dispatch.json || true
          [ "$code" = "204" ]
